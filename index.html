<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Salmas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #0f172a;
    }

    #canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.04em;
      margin-bottom: 0.5rem;
      color: black;
      text-shadow: 0 0 10px white;
    }

    p {
      font-size: 1rem;
      color: #475569;
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .links {
      display: flex;
      gap: 1rem;
      pointer-events: auto;
      align-items: center;
    }

    a {
      color: var(--theme-color, #0269a4);
      display: inline-flex;
      transition: color 0.2s ease, filter 0.2s ease;
    }

    a:hover {
      filter: brightness(0.7);
    }

    a svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <main class="content">
    <h1>Michael Salmas</h1>
    <p>Frontend Engineer - <a href="https://chess.com" target="_blank"  rel="noopener noreferrer">Chess.com</a></p>
    <div class="links">
      <a href="https://www.linkedin.com/in/michael-salmas/" target="_blank" rel="noopener noreferrer">
        <svg xmlns="http://www.w3.org" viewBox="0 0 24 24">
          <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
        </svg>
      </a>

      <a href="https://github.com/michael-salmas" target="_blank" rel="noopener noreferrer" aria-label="Github">
        <svg xmlns="http://www.w3.org" viewBox="0 0 24 24">
          <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
        </svg>
      </a>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const center = {x: 0, y: 0};

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      center.x = canvas.width / 2;
      center.y = canvas.height / 2;
    }

    window.addEventListener('resize', resize);
    resize();

    const colorThemes = [
      "2, 105, 164",
      "4, 120, 87",
      "180, 83, 9",
      "162, 28, 110",
      "109, 40, 217",
      "194, 65, 12"
    ];

    const activeTheme = colorThemes[Math.floor(Math.random() * colorThemes.length)];
    document.documentElement.style.setProperty('--theme-color', `rgb(${activeTheme})`);

    const fieldParams = {
      frequency1x: Math.random() * 1.5 + 0.8,
      frequency1y: Math.random() * 1.5 + 0.8,
      frequency2x: Math.random() * 2.0 + 0.5,
      frequency2y: Math.random() * 2.0 + 0.5,
      frequency3x:  Math.random() * 1.2 + 0.4,
      polyIntensity: Math.random() * 2.5 + 0.5,

      dir1: Math.random() > 0.5 ? 1 : -1,
      dir2: Math.random() > 0.5 ? 1 : -1,
      dir3: Math.random() > 0.5 ? 1 : -1,

      scale: Math.random() * 0.001 + 0.0015
    };

    let time = 0;

    function evaluateField(x, y, t) {
      const dx = (x - center.x) * 0.003;
      const dy = (y - center.y) * 0.003;

      const saddle = ((dx * dx * dx) - (3 * dx * dy * dy)) * Math.exp(-1 * ((dx * dx) + (dy * dy)) / (fieldParams.polyIntensity));
      const polyField = Math.sin(saddle) * 0.4;

      const nx = x * fieldParams.scale;
      const ny = y * fieldParams.scale;

      const wave1 = Math.sin(nx * fieldParams.frequency1x + t * fieldParams.dir1) * Math.cos(ny * fieldParams.frequency1y - t * 0.7 * fieldParams.dir2);
      const wave2 = Math.sin(ny * fieldParams.frequency2y + t * 0.4 * fieldParams.dir2) * Math.cos(nx * fieldParams.frequency2x + t * fieldParams.dir3);
      const wave3 = Math.sin((nx + ny) * fieldParams.frequency3x + t * 0.5 * fieldParams.dir3);

      return (wave1 * 0.5 + wave2 * 0.35 + wave3 * 0.15) + polyField;
    }

    function isIntersectionOfLine(point1, point2, level) {
      return ((point1 >= level && point2 < level) || (point1 < level && point2 >= level));
    }

    function getContactPoint(point1, point2, level) {
      return (level - point1) / (point2 - point1);
    }

    function animate() {
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.lineWidth = 2.0;

      const contourLevels = [-0.5, -0.3, -0.1, 0.1, 0.3, 0.5];
      const step = 15;


      for (let y = -step; y < canvas.height + step; y += step) {
        for (let x = -step; x < canvas.width + step; x += step) {

          const segmentTopLeft = evaluateField(x, y, time);
          const segmentTopRight = evaluateField(x + step, y, time);
          const segmentBottomLeft = evaluateField(x, y + step, time);
          const segmentBottomRight = evaluateField(x + step, y + step, time);

          contourLevels.forEach(level => {
            let points = [];

            if (isIntersectionOfLine(segmentTopLeft, segmentTopRight, level)) {
              points.push({ x: x + step * getContactPoint(segmentTopLeft, segmentTopRight, level), y: y });
            }

            if (isIntersectionOfLine(segmentTopRight, segmentBottomRight, level)) {;
              points.push({ x: x + step, y: y + step * getContactPoint(segmentTopRight, segmentBottomRight, level) });
            }

            if (isIntersectionOfLine(segmentBottomLeft, segmentBottomRight, level)) {
              points.push({ x: x + step * getContactPoint(segmentBottomLeft, segmentBottomRight, level), y: y + step });
            }

            if (isIntersectionOfLine(segmentTopLeft, segmentBottomLeft, level)) {
              points.push({ x: x, y: y + step * getContactPoint(segmentTopLeft, segmentBottomLeft, level) });
            }

            if (points.length >= 2) {
              ctx.beginPath();

              const alpha = 0.02 + (level + 0.5) * 0.16;
              ctx.strokeStyle = `rgba(${activeTheme}, ${alpha})`;
              ctx.moveTo(points[0].x, points[0].y);
              ctx.lineTo(points[1].x, points[1].y);
              ctx.stroke();
            }
          });
        }
      }

      time += 0.0005;
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
